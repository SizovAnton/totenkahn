name: TOTENKAHN Windows candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build and accept core executable behavior
        env:
          TOTENKAHN_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy RemoteSigned -Force
          python -u -B scripts/build_windows_acceptance.py --source-commit "$env:TOTENKAHN_SOURCE_COMMIT"
          exit $LASTEXITCODE
      - name: Export verified candidate
        run: |
          $builds = @(Get-ChildItem -LiteralPath build -Directory -Filter 'windows-*')
          if ($builds.Count -ne 1) { throw 'Expected exactly one build in clean checkout' }
          $build = $builds[0].FullName
          python -B scripts/package_ci_release.py --build-dir "$build" --output-dir delivery
          exit $LASTEXITCODE
      - name: Candidate bundle
        uses: actions/upload-artifact@v7
        with:
          name: totenkahn-windows-candidate-${{ github.sha }}
          path: delivery/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/windows-*/*.log
            build/windows-*/*report.json
            build/windows-*/source-checks/
            build/windows-*/quality/
            build/windows-*/acceptance/*.json
            build/windows-*/acceptance/*.txt
            build/windows-*/ci/
          if-no-files-found: warn
          retention-days: 14
